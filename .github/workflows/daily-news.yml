name: 每日新闻抓取

on:
  schedule:
    # 每天 UTC 0:00 和 12:00 运行（北京时间 8:00 和 20:00）
    - cron: '0 */2 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install feedparser

      - name: 抓取新闻
        run: python fetch_news.py

      - name: 提交更新
        run: |
          git config --global user.name "News Bot"
          git config --global user.email "news-bot@github.com"
          git add news.json news.md
          if git diff --staged --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "📰 $(date -u '+%Y-%m-%d %H:%M') 新闻更新"
            git push
            echo "✅ 已推送更新"
          fi

      # ===========================================================
      # 📄 生成网页并部署到 GitHub Pages
      # ===========================================================
      - name: 检查新闻文件
        run: |
          if [ ! -f news.md ]; then
            echo "❌ 未找到 news.md，跳过部署"
            exit 1
          fi
          echo "✅ news.md 已生成"

      - name: 生成网页
        run: |
          mkdir -p pages-dist
          python3 << 'PYEOF'
          import json

          with open('news.md', 'r', encoding='utf-8') as f:
              md = f.read()

          html = """<!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>每日财经新闻</title>
          <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
          <style>
          *{margin:0;padding:0;box-sizing:border-box}
          body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:900px;margin:0 auto;padding:20px;line-height:1.7;color:#333;background:#fff}
          h1{color:#1a1a2e;margin:20px 0 15px;border-bottom:2px solid #e0e0e0;padding-bottom:10px}
          h2{color:#2c3e50;margin:18px 0 10px}
          h3{color:#34495e;margin:14px 0 8px}
          a{color:#0969da;text-decoration:none}
          a:hover{text-decoration:underline}
          table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
          th,td{border:1px solid #ddd;padding:8px 12px;text-align:left}
          th{background:#f6f8fa;font-weight:600}
          tr:nth-child(even){background:#f9f9f9}
          hr{border:none;border-top:1px solid #e0e0e0;margin:20px 0}
          ul,ol{padding-left:25px;margin:8px 0}
          li{margin:4px 0}
          blockquote{border-left:4px solid #0969da;margin:10px 0;padding:5px 15px;color:#666;background:#f6f8fa}
          code{background:#f6f8fa;padding:2px 6px;border-radius:4px;font-size:13px}
          @media(prefers-color-scheme:dark){
            body{background:#0d1117;color:#c9d1d9}
            h1{color:#f0f6fc;border-color:#30363d}
            h2{color:#f0f6fc}
            h3{color:#c9d1d9}
            a{color:#58a6ff}
            th{background:#161b22}
            td{border-color:#30363d}
            tr:nth-child(even){background:#161b22}
            hr{border-color:#30363d}
            blockquote{background:#161b22;color:#8b949e;border-color:#58a6ff}
            code{background:#161b22}
          }
          </style>
          </head>
          <body>
          <div id="content">加载中...</div>
          <script>
          const md = """ + json.dumps(md) + """;
          document.getElementById('content').innerHTML = marked.parse(md);
          </script>
          </body>
          </html>"""

          with open('pages-dist/index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          print('✅ index.html generated')
          PYEOF
          
      # 钉钉 Webhook
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}

      #- name: 部署到 GitHub Pages
      #  uses: peaceiris/actions-gh-pages@v4
      #  with:
      #    github_token: ${{ secrets.GITHUB_TOKEN }}
      #    publish_dir: pages-dist
      #    publish_branch: gh-pages
      #    keep_files: false
      #    user_name: 'github-actions[bot]'
      #    user_email: 'github-actions[bot]@users.noreply.github.com'
      #    commit_message: '🚀 Deploy news to GitHub Pages'
