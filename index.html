<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日 AI 财经新闻研判</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f8f9fa; color: #333; }
        .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .ai-summary { background: #eef2ff; border-left: 4px solid #4f46e5; }
        .ai-summary h2 { margin-top: 0; color: #3730a3; }
        .analysis-text { line-height: 1.7; font-size: 15px; color: #1e1b4b; }
        .analysis-text p { margin-bottom: 12px; }
        .analysis-text p:last-child { margin-bottom: 0; }
        .news-item { border-bottom: 1px solid #eee; padding: 12px 0; }
        .news-item:last-child { border-bottom: none; }
        .news-title { text-decoration: none; color: #1e293b; font-weight: bold; font-size: 16px; }
        .news-title:hover { color: #4f46e5; }
        .source-tag { background: #e2e8f0; font-size: 12px; padding: 2px 6px; border-radius: 4px; margin-right: 8px; color: #475569; }
        .news-summary { font-size: 14px; color: #64748b; margin: 6px 0 0 0; line-height: 1.5; }
    </style>
</head>
<body>

    <h1>📰 每日财经新闻 AI 研判</h1>
    <div id="update-time" style="color: #666; font-size: 14px; margin-bottom: 20px;">加载中...</div>

    <!-- 1. AI 研判总览区域 -->
    <div class="card ai-summary" id="ai-card" style="display: none;">
        <h2>🤖 AI 财经情报深度研判</h2>
        <div class="analysis-text" id="ai-analysis"></div>
    </div>

    <!-- 2. 重磅新闻 -->
    <div class="card">
        <h2>🔥 核心重磅新闻</h2>
        <div id="important-news">读取中...</div>
    </div>

    <!-- 3. 兴趣/产业新闻 -->
    <div class="card">
        <h2>💡 产业与市场关注</h2>
        <div id="interest-news">读取中...</div>
    </div>

    <script>
        async function loadNews() {
            try {
                // 1. 加时间戳防止浏览器静态缓存 news.json
                const res = await fetch(`./news.json?t=${Date.now()}`);
                if (!res.ok) throw new Error(`HTTP 错误! 状态码: ${res.status}`);
                
                const data = await res.json();
                console.log("成功获取 JSON 数据:", data); // 控制台调试日志

                // 2. 渲染更新时间
                if (data.updated) {
                    const updateDate = new Date(data.updated);
                    document.getElementById('update-time').innerText = `更新时间：${updateDate.toLocaleString('zh-CN')}`;
                } else {
                    document.getElementById('update-time').innerText = '更新时间：未知';
                }

                // 3. 渲染 AI 全局研判（增强型清洗与渲染）
                const aiCard = document.getElementById('ai-card');
                const aiAnalysis = document.getElementById('ai-analysis');

                if (data.summary_analysis && typeof data.summary_analysis === 'string' && data.summary_analysis.trim() !== "") {
                    aiCard.style.display = 'block';
                    
                    // 清洗文本中的 Markdown 符号并处理换行
                    let text = data.summary_analysis.trim();
                    
                    // 解析Markdown语法：**加粗** 替换为 <strong>，换行符转为 <p> 或 <br>
                    let formattedText = text
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\n\n/g, '</p><p>')
                        .replace(/\n/g, '<br>');

                    aiAnalysis.innerHTML = `<p>${formattedText}</p>`;
                } else {
                    console.warn("未检测到有效 summary_analysis 字段，隐蔽研判卡片");
                    aiCard.style.display = 'none';
                }

                // 4. 渲染重磅新闻
                renderList(data.important, 'important-news');

                // 5. 渲染兴趣新闻
                renderList(data.interest, 'interest-news');

            } catch (err) {
                console.error("加载 news.json 失败:", err);
                document.getElementById('update-time').innerText = '❌ 数据加载失败，请刷新页面重试';
                document.getElementById('important-news').innerHTML = '<p style="color:#ef4444;">未获取到新闻数据，请检查 news.json 文件路径</p>';
                document.getElementById('interest-news').innerHTML = '<p style="color:#ef4444;">未获取到新闻数据</p>';
            }
        }

        function renderList(items, containerId) {
            const container = document.getElementById(containerId);
            if (!items || !Array.isArray(items) || items.length === 0) {
                container.innerHTML = '<p style="color:#999;">暂无相关新闻</p>';
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="news-item">
                    <div>
                        <span class="source-tag">${item.source || '财经'}</span>
                        <a class="news-title" href="${item.url || '#'}" target="_blank" rel="noopener noreferrer">${item.title || '无标题'}</a>
                    </div>
                    ${item.summary ? `<p class="news-summary">${item.summary}</p>` : ''}
                </div>
            `).join('');
        }

        // 页面加载完成后执行
        document.addEventListener("DOMContentLoaded", loadNews);
    </script>
</body>
</html>
