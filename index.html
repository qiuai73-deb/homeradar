<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国内新闻</title>
    <style>
        /* ========== CSS 变量（主题核心） ========== */
        :root {
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --bg-card-ai: #eef2ff;
            --bg-time: #f1f5f9;
            --bg-source: #e2e8f0;
            --text-primary: #333333;
            --text-title: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #475569;
            --text-light: #999999;
            --text-ai: #1e1b4b;
            --border-ai: #4f46e5;
            --border-item: #eeeeee;
            --link-color: #1e293b;
            --link-hover: #4f46e5;
            --shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* ========== 暗色主题 ========== */
        [data-theme="dark"] {
            --bg-body: #0d1117;
            --bg-card: #161b22;
            --bg-card-ai: #1c2333;
            --bg-time: #21262d;
            --bg-source: #21262d;
            --text-primary: #e6edf3;
            --text-title: #f0f6fc;
            --text-secondary: #8b949e;
            --text-muted: #8b949e;
            --text-light: #8b949e;
            --text-ai: #c9d1d9;
            --border-ai: #58a6ff;
            --border-item: #30363d;
            --link-color: #f0f6fc;
            --link-hover: #58a6ff;
            --shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* ========== 全局样式 ========== */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
        }

        /* ========== 顶部栏（标题 + 切换开关） ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 8px;
        }

        .header h1 {
            color: var(--text-title);
            margin: 0;
            font-size: 24px;
        }

        /* ========== 切换开关 ========== */
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .theme-toggle input {
            display: none;
        }

        .toggle-slider {
            position: relative;
            width: 48px;
            height: 26px;
            background: var(--bg-source);
            border-radius: 13px;
            transition: background 0.3s;
            flex-shrink: 0;
            border: 1px solid var(--border-item);
        }

        .toggle-slider::after {
            content: "☀️";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: var(--bg-card);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: transform 0.3s, background 0.3s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        [data-theme="dark"] .toggle-slider {
            background: #3d3d5c;
        }

        [data-theme="dark"] .toggle-slider::after {
            content: "🌙";
            transform: translateX(22px);
        }

        /* ========== 卡片 ========== */
        .card {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: background 0.3s, box-shadow 0.3s;
        }

        .card h2 {
            color: var(--text-title);
            margin-top: 0;
        }

        .ai-summary {
            background: var(--bg-card-ai);
            border-left: 4px solid var(--border-ai);
            transition: background 0.3s, border-color 0.3s;
        }

        .ai-summary h2 {
            color: var(--border-ai);
        }

        .analysis-text {
            line-height: 1.7;
            font-size: 15px;
            color: var(--text-ai);
        }

        .analysis-text p {
            margin-bottom: 12px;
        }
        .analysis-text p:last-child {
            margin-bottom: 0;
        }

        .news-item {
            border-bottom: 1px solid var(--border-item);
            padding: 12px 0;
            transition: border-color 0.3s;
        }
        .news-item:last-child {
            border-bottom: none;
        }

        .news-title {
            text-decoration: none;
            color: var(--link-color);
            font-weight: bold;
            font-size: 16px;
            transition: color 0.3s;
        }
        .news-title:hover {
            color: var(--link-hover);
        }

        .source-tag {
            background: var(--bg-source);
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
            color: var(--text-secondary);
            transition: background 0.3s, color 0.3s;
        }

        .news-summary {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 6px 0 0 0;
            line-height: 1.5;
        }

        #update-time {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
            background: var(--bg-time);
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            transition: background 0.3s, color 0.3s;
        }

        #update-time .label {
            font-weight: normal;
        }
        #update-time .time {
            font-weight: 600;
            color: var(--text-title);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ====== 顶部栏 ====== -->
    <div class="header">
        <h1>📰 国内新闻</h1>
        <label class="theme-toggle">
            <span id="theme-label">🌙 暗色</span>
            <input type="checkbox" id="theme-checkbox">
            <span class="toggle-slider"></span>
        </label>
    </div>

    <div id="update-time">⏱️ <span class="label">更新时间：</span><span class="time">加载中...</span></div>

    <!-- 1. AI 研判总览区域 -->
    <div class="card ai-summary" id="ai-card" style="display: none;">
        <h2>🤖 国内新闻</h2>
        <div class="analysis-text" id="ai-analysis"></div>
    </div>

    <!-- 2. 重磅新闻 -->
    <div class="card">
        <h2>🔥 核心重磅新闻</h2>
        <div id="important-news">读取中...</div>
    </div>

    <!-- 3. 兴趣/产业新闻 -->
    <div class="card">
        <h2>💡 产业与市场关注</h2>
        <div id="interest-news">读取中...</div>
    </div>

    <script>
        // ========== 主题切换逻辑 ==========
        (function initTheme() {
            const checkbox = document.getElementById('theme-checkbox');
            const label = document.getElementById('theme-label');

            // 从 localStorage 读取偏好
            const savedTheme = localStorage.getItem('theme') || 'light';
            const isDark = savedTheme === 'dark';

            // 应用主题
            document.documentElement.setAttribute('data-theme', savedTheme);
            checkbox.checked = isDark;
            label.textContent = isDark ? '☀️ 亮色' : '🌙 暗色';

            // 监听切换事件
            checkbox.addEventListener('change', function() {
                const newTheme = this.checked ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                label.textContent = newTheme === 'dark' ? '☀️ 亮色' : '🌙 暗色';
            });
        })();

        // ========== 新闻加载逻辑（不变） ==========
        async function loadNews() {
            const updateTimeEl = document.getElementById('update-time');
            const timeSpan = updateTimeEl.querySelector('.time');

            try {
                const res = await fetch(`./news.json?t=${Date.now()}`);
                if (!res.ok) throw new Error(`HTTP 错误! 状态码: ${res.status}`);
                
                const data = await res.json();
                console.log("成功获取 JSON 数据:", data);

                if (data.updated) {
                    const updateDate = new Date(data.updated);
                    const beijingTime = updateDate.toLocaleString('zh-CN', { 
                        timeZone: 'Asia/Shanghai',
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    });
                    timeSpan.textContent = beijingTime;
                } else {
                    timeSpan.textContent = '未知';
                }

                const aiCard = document.getElementById('ai-card');
                const aiAnalysis = document.getElementById('ai-analysis');

                if (data.summary_analysis && typeof data.summary_analysis === 'string' && data.summary_analysis.trim() !== "") {
                    aiCard.style.display = 'block';
                    let text = data.summary_analysis.trim();
                    let formattedText = text
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\n\n/g, '</p><p>')
                        .replace(/\n/g, '<br>');
                    aiAnalysis.innerHTML = `<p>${formattedText}</p>`;
                } else {
                    console.warn("未检测到有效 summary_analysis 字段，隐藏研判卡片");
                    aiCard.style.display = 'none';
                }

                renderList(data.important, 'important-news');
                renderList(data.interest, 'interest-news');

            } catch (err) {
                console.error("加载 news.json 失败:", err);
                timeSpan.textContent = '❌ 加载失败';
                document.getElementById('important-news').innerHTML = '<p style="color:#ef4444;">未获取到新闻数据，请检查 news.json 文件路径</p>';
                document.getElementById('interest-news').innerHTML = '<p style="color:#ef4444;">未获取到新闻数据</p>';
            }
        }

        function renderList(items, containerId) {
            const container = document.getElementById(containerId);
            if (!items || !Array.isArray(items) || items.length === 0) {
                container.innerHTML = '<p style="color:var(--text-secondary);">暂无相关新闻</p>';
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="news-item">
                    <div>
                        <span class="source-tag">${item.source || '财经'}</span>
                        <a class="news-title" href="${item.url || '#'}" target="_blank" rel="noopener noreferrer">${item.title || '无标题'}</a>
                    </div>
                    ${item.summary ? `<p class="news-summary">${item.summary}</p>` : ''}
                </div>
            `).join('');
        }

        document.addEventListener("DOMContentLoaded", loadNews);
    </script>
</body>
</html>
